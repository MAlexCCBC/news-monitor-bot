name: Bot

on:
  # Rulezi botul manual din tab-ul Actions -> "Run workflow"
  workflow_dispatch:
  push:
    branches: [master]
  # AUTO-RESTART: GitHub limiteaza UN JOB la max 6 ore (limita hard, nedeschimbabila
  # pe runner-ele lor). Deci botul se reporneste SINGUR la fiecare 5 ore: la
  # momentul cron, grupul de concurenta opreste instanta veche curat (isi
  # persista baza de date) si cea noua preia cu istoricul restaurat din
  # branch-ul data. Rezultat: botul ruleaza CONTINUU, fara interventie.
  # Nota: GitHub dezactiveaza schedule-urile dupa 60 de zile de inactivitate
  # completa a repo-ului - commiturile periodice pe branch-ul data tin repo-ul viu.
  schedule:
    - cron: "0 */5 * * *"

jobs:
  # Validare rapida la fiecare push (fara secrete, merge si fara ele)
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Verifica sintaxa
        run: node --check src/index.js && echo "sintax OK"

  # Ruleaza botul: manual (Run workflow), la fiecare push pe master SI
  # programat la fiecare 5 ore (auto-restart - vezi comentariul de la schedule).
  run:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push'
    # CICLU STRICT DE 5 ORE: jobul se opreste singur dupa 4h50m (graceful -
    # isi salveaza baza de date prin handler-ele SIGINT/SIGTERM), lasand loc
    # ca cron-ul de la granița de 5h sa porneasca instanta urmatoare. Asa
    # ritmul e FIX 5h intre porniri, chiar daca GitHub intarzie uneori
    # rulările programate; concurența rămâne plasă de siguranță la suprapuneri.
    timeout-minutes: 290
    permissions:
      contents: write
    # O SINGURA instanta de bot: daca dai Run din nou cat timp botul ruleaza,
    # instanta veche e oprita curat (isi persista baza de date la oprire) si
    # cea noua preia. Fara asta, doua rulari simultan pe acelasi TG_SESSION
    # sunt respinse de Telegram cu 406 AUTH_KEY_DUPLICATED. Push-urile obisnuite
    # NU ating acest grup (jobul lor "run" e sarit), deci nu opresc botul activ.
    concurrency:
      group: news-bot-run
      cancel-in-progress: true
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      NOTIFY_BOT_TOKEN: ${{ secrets.NOTIFY_BOT_TOKEN }}
      NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      CHANNELS: ${{ secrets.CHANNELS }}
      KEYWORDS: ${{ secrets.KEYWORDS }}
      SIMILARITY_THRESHOLD: ${{ secrets.SIMILARITY_THRESHOLD }}
      HISTORY_HOURS: ${{ secrets.HISTORY_HOURS }}
      IMAGE_HISTORY_DAYS: ${{ secrets.IMAGE_HISTORY_DAYS }}
      BYPASS_CHANNELS: ${{ secrets.BYPASS_CHANNELS }}
      ROMANIAN_PERSONALITIES: ${{ secrets.ROMANIAN_PERSONALITIES }}
      DB_PERSIST_BRANCH: data
    steps:
      - uses: actions/checkout@v5

      # Baza de date se restauraza din branch-ul "data" (botul o salveaza
      # periodic + la oprire). Asa istoricul de 72h NU se pierde intre rulari,
      # chiar daca jobul e oprit fortat (ultima salvare periodica ramane).
      - name: Restaurare baza de date din branch data
        run: |
          git fetch origin data || true
          if git cat-file -e origin/data:data.sqlite 2>/dev/null; then
            git checkout origin/data -- data.sqlite
            echo "Baza de date restaurata din branch-ul data"
          else
            echo "Baza de date noua (branch-ul data nu exista inca)"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci

      - name: Porneste botul
        run: npm start