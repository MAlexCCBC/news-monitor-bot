name: Bot

on:
  # Rulezi botul manual din tab-ul Actions -> "Run workflow"
  workflow_dispatch:
  push:
    branches: [master]
  # PLASA DE SIGURANTA: relansarea principala e facuta DINAMIC de instanta
  # anterioara prin workflow_dispatch (porneste in cateva secunde).
  # Cron-ul orar prinde cazurile in care GitHub a avut o cadere temporara
  # sau lantul a fost intrerupt.
  schedule:
    - cron: "0 * * * *"

jobs:
  # Validare rapida la fiecare push (fara secrete, merge si fara ele)
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Verifica sintaxa
        run: node --check src/index.js && echo "sintax OK"

  # Ruleaza botul: la push pe master (auto-deploy), programat (plasă de
  # siguranță) si manual din tab-ul Actions -> "Run workflow".
  run:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push'
    # Failsafe extern: watchdog-ul intern (pasul de pornire bot) opreste
    # botul la 4h50m; daca acela esueaza vreodata, acest timeout prinde jobul
    # inainte de limita hard de 6h a runner-elor GitHub-hosted.
    timeout-minutes: 295
    permissions:
      contents: write
      actions: write
    # O SINGURA instanta de bot: daca dai Run din nou cat timp botul ruleaza,
    # instanta veche e oprita curat (isi persista baza de date la oprire) si
    # cea noua preia. Fara asta, doua rulari simultan pe acelasi TG_SESSION
    # sunt respinse de Telegram cu 406 AUTH_KEY_DUPLICATED.
    concurrency:
      group: news-bot-run
      cancel-in-progress: true
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      NOTIFY_BOT_TOKEN: ${{ secrets.NOTIFY_BOT_TOKEN }}
      NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      CHANNELS: ${{ secrets.CHANNELS }}
      KEYWORDS: ${{ secrets.KEYWORDS }}
      SIMILARITY_THRESHOLD: ${{ secrets.SIMILARITY_THRESHOLD }}
      HISTORY_HOURS: ${{ secrets.HISTORY_HOURS }}
      IMAGE_HISTORY_DAYS: ${{ secrets.IMAGE_HISTORY_DAYS }}
      BYPASS_CHANNELS: ${{ secrets.BYPASS_CHANNELS }}
      ROMANIAN_PERSONALITIES: ${{ secrets.ROMANIAN_PERSONALITIES }}
      DB_PERSIST_BRANCH: data
      BOT_MAX_RUNTIME_MIN: 290
    steps:
      - uses: actions/checkout@v5

      # Baza de date se restauraza din branch-ul "data" (botul o salveaza
      # periodic + la oprire). Asa istoricul de 72h NU se pierde intre rulari,
      # chiar daca jobul e oprit fortat (ultima salvare periodica ramane).
      - name: Restaurare baza de date din branch data
        run: |
          git fetch origin data || true
          if git cat-file -e origin/data:data.sqlite 2>/dev/null; then
            git checkout origin/data -- data.sqlite
            echo "Baza de date restaurata din branch-ul data"
          else
            echo "Baza de date noua (branch-ul data nu exista inca)"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci

      - name: Porneste botul (watchdog 4h50m)
        run: |
          set +e
          # Node se opreste singur dupa 290 minute (BOT_MAX_RUNTIME_MIN), salvand baza de date.
          # timeout GNU este pastrat ca dubla siguranta.
          timeout --signal=TERM --kill-after=60s 17400s node src/index.js
          code=$?
          echo "Botul s-a oprit cu codul de iesire: $code"

      # CICLU CONTINUU DINAMIC: instanta care tocmai s-a terminat
      # declanseaza IMEDIAT instanta urmatoare prin workflow_dispatch.
      # Nu se relanseaza doar daca rularea a fost anulata manual (cancel).
      - name: Relanseaza instant urmatoarea instanta
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run bot.yml --ref "${{ github.ref_name }}"
          echo "Instanta urmatoare a fost declansata (ciclu continuu)"