name: Attribution audit
on:
  push:
    branches: [fix/missing-role-attribution]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node --check src/ai/rewrite.js && node --check src/ai/prepare-post.js
